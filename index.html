<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语会议不掉线 · Day 1</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e8efff;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:28px 18px 70px}.tag{color:#7dd3fc;font-size:13px;letter-spacing:.12em}.hero{padding:24px 0}h1{font-size:clamp(28px,5vw,43px);margin:12px 0}p{line-height:1.7;color:#b6c4d9}.card{background:#162239;border:1px solid #2a3c59;border-radius:20px;padding:22px;margin:16px 0}.meta{display:flex;justify-content:space-between;color:#a8b8d1;font-size:13px}.bar{height:7px;border-radius:10px;background:#2a3c59;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:#38bdf8;transition:width .2s}.english{font-size:23px;line-height:1.55;color:white;margin:18px 0}.option{width:100%;display:block;text-align:left;padding:15px;border-radius:12px;border:1px solid #40516e;background:#1b2b46;color:#e8efff;margin:9px 0;cursor:pointer;font-size:15px}.option:hover{border-color:#38bdf8}.option.selected{border-color:#38bdf8;background:#123d57}.option:disabled{opacity:.85;cursor:default}button.primary{background:#38bdf8;border:0;color:#082033;font-weight:750;padding:13px 22px;border-radius:12px;cursor:pointer;font-size:15px}button.secondary{background:transparent;border:1px solid #56718e;color:#e8efff;padding:12px 18px;border-radius:12px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-left:3px solid #38bdf8;padding:12px 16px;background:#0c293c;margin:15px 0;line-height:1.8}.small{font-size:13px;color:#a8b8d1}.hidden{display:none}textarea{width:100%;min-height:105px;border:1px solid #40516e;background:#0b172a;color:white;border-radius:12px;padding:12px;font-size:16px}footer{color:#8da1bd;font-size:12px;line-height:1.7;margin-top:32px}</style></head><body><main><div class="hero"><div class="tag">ENGLISH MEETING LAB · DAY 01</div><h1>英语会议不掉线</h1><p>Day 1｜听不懂、跟不上时，如何把对话拉回自己的节奏？</p><div class="meta"><span>约 15 分钟 · 6 道情境题</span><span id="counter">0 / 6</span></div><div class="bar"><div id="progress" style="width:0%"></div></div></div><section id="app" class="card"></section><footer>© English Meeting Lab · MVP V0.1。语音朗读使用设备浏览器内置语音功能，发音和可用性取决于设备；本版不录音、不上传学习数据。进度仅保存在当前浏览器设备中。</footer></main><script>
const lessons=[
{scene:'客户要求你解释一组数字',en:'Before we move forward, could you walk us through how you arrived at those numbers?',q:'客户真正希望你做什么？',opts:['尽快提交报价','一步一步解释数字的计算依据','介绍团队成员'],a:1,why:'walk us through = 带我们逐步了解；how you arrived at those numbers = 数字如何得出。',reply:'Sure. Let me walk you through the assumptions behind the figures.'},
{scene:'对方说得太快，你漏掉了截止时间',en:'We need to wrap this up by Thursday, assuming procurement signs off.',q:'你不确定截止日期和前提条件，最合适的回应是？',opts:['Sorry, could you repeat the deadline and the condition?', 'Yes, everything is ready.', 'I disagree with the timeline.'],a:0,why:'不要假装听懂。明确要求重复 deadline 和 condition，可以减少沟通失误。',reply:'Sorry, could you repeat the deadline and the condition?'},
{scene:'会议中出现不熟悉的术语',en:'We may need to revisit the acceptance criteria before the pilot run.',q:'你不知道 acceptance criteria 的具体含义，应该怎么问？',opts:['Can we skip this part?', 'What do you mean by acceptance criteria in this project?', 'That is not my responsibility.'],a:1,why:'What do you mean by ...? 是自然的澄清方式；这里指验收标准。',reply:'What do you mean by acceptance criteria in this project?'},
{scene:'网络卡顿导致你只听见一半',en:'The main concern is not the cost, but the long-term reliability of the system.',q:'你听漏了对方最关注的内容，怎样确认？',opts:['So, if I understand correctly, reliability is the main concern, not cost?', 'The cost is definitely too high.', 'Can we finish now?'],a:0,why:'So, if I understand correctly ... 用自己的话复述确认，尤其适合网络不稳定时。',reply:'So, if I understand correctly, reliability is the main concern, not cost?'},
{scene:'对方连续讲了很多细节',en:'First, we will review the specifications. Then we will run a short trial and share the results.',q:'你想让对方分步骤解释，应该说？',opts:['Could you walk me through the steps one more time?', 'I have nothing to add.', 'Let us change the subject.'],a:0,why:'Could you walk me through ...? 是礼貌请求逐步解释的高频商务表达。',reply:'Could you walk me through the steps one more time?'},
{scene:'会议接近尾声，确认下一步',en:'Let us circulate the updated proposal and reconvene early next week.',q:'你想确认具体由谁发方案，怎么问最有效？',opts:['Who will send the updated proposal, and by when?', 'That sounds interesting.', 'I did not like the meeting.'],a:0,why:'抓住责任人和时间节点，比简单说 OK 更能避免会后执行落空。',reply:'Who will send the updated proposal, and by when?'}
];
const progressKey = 'english-meeting-day1-answers-v1';
const saved = JSON.parse(localStorage.getItem(progressKey) || 'null');
let answers = saved?.answers || [];
let idx = saved?.idx || 0;
let selected = answers[idx] ?? null;
let checked = selected !== null;
const app = document.getElementById('app');

function save() {
  localStorage.setItem(progressKey, JSON.stringify({idx, answers}));
}

function speak(t){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读，请使用 Chrome、Safari 或 Edge。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function render(){document.getElementById('counter').textContent=Math.min(idx,6)+' / 6';document.getElementById('progress').style.width=(Math.min(idx,6)/6*100)+'%';if(idx>=lessons.length){
  const score = lessons.filter((lesson, i) => answers[i] === lesson.a).length;
  app.innerHTML=`<div class="tag">TRAINING COMPLETE</div><h2>Day 1 已完成 🎉</h2><p class="english">${score} / 6 分</p><p>${score>=5?'很好！你能识别大部分会议澄清场景。':'建议再练习一次，把关键澄清表达练熟。'}</p><h3>今天最值得记住的 4 句话</h3><p>Could you say that again, please?<br>What do you mean by that?<br>Could you walk me through that?<br>So, if I understand correctly, ...</p><div class="actions"><button class="primary" id="restart">重新训练</button><button class="secondary" id="copy">复制训练结果</button></div><p class="small">提示：这是选择题训练，不等同于真实语音听辨能力测评。</p>`;document.getElementById('restart').onclick=()=>{idx=0;answers=[];selected=null;checked=false;save();render()};document.getElementById('copy').onclick=()=>{const t=`英语会议不掉线 Day 1：${score}/6 分`;navigator.clipboard?.writeText(t).then(()=>alert('已复制'),()=>prompt('复制结果：',t))||prompt('复制结果：',t)};return}const l=lessons[idx];app.innerHTML=`<div class="tag">SCENARIO ${String(idx+1).padStart(2,'0')} / 06</div><h2>${l.scene}</h2><p class="small">先点击播放，尽量不要看英文原句。</p><div class="actions"><button class="primary" id="listen">▶ 播放英文</button><button class="secondary" id="slower">慢速播放</button><button class="secondary" id="show">显示 / 隐藏原文</button></div><div class="english hidden" id="transcript">${l.en}</div><h3>${l.q}</h3><div id="opts">${l.opts.map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="result"></div><div class="actions"><button class="primary" id="check" disabled>确认答案</button><button class="secondary hidden" id="next">${idx===5?'查看成绩':'下一题 →'}</button></div>`;document.getElementById('listen').onclick=()=>speak(l.en);document.getElementById('slower').onclick=()=>{if(!('speechSynthesis'in window))return alert('设备不支持语音');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(l.en);u.lang='en-US';u.rate=.65;speechSynthesis.speak(u)};document.getElementById('show').onclick=()=>document.getElementById('transcript').classList.toggle('hidden');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(checked)return;selected=Number(b.dataset.i);document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('check').disabled=false});function showFeedback() {
  document.querySelectorAll('.option').forEach(button => {
    button.disabled = true;
    button.classList.toggle('selected', Number(button.dataset.i) === selected);
  });
  document.getElementById('result').innerHTML=`<div class="feedback"><strong>${selected===l.a?'✓ 回答正确':'正确答案：'+String.fromCharCode(65+l.a)}</strong><br>${l.why}<br><br><strong>建议开口练习：</strong><br>${l.reply}<br><button class="secondary" id="replyAudio" style="margin-top:10px">▶ 听示范回应</button></div>`;document.getElementById('replyAudio').onclick=()=>speak(l.reply);document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');}
if (checked) showFeedback();

document.getElementById('check').onclick = () => {
  if (selected === null || checked) return;
  answers[idx] = selected;
  checked = true;
  save();
  showFeedback();
};

document.getElementById('next').onclick=()=>{idx++;selected=null;checked=false;save();render()}}render();
</script></body></html>

function save() {
  try {
    const merged = new Map();
    for (const event of [...validHistory(readState()?.history), ...history]) {
      const key = event.round + ':' + event.qid;
      const previous = merged.get(key);
      if (!previous || event.at < previous.at) merged.set(key, event);
    }
    history = [...merged.values()].sort((a, b) => a.at - b.at).slice(-600);
    firstAnswers = activeLessons.map(question => history.find(event => event.round === roundId && event.qid === question.id)?.choice ?? null);
    localStorage.setItem(stateKey, JSON.stringify({history, round:{
      id:roundId, mode, questionIds:activeLessons.map(question => question.id), idx, answers, challengerScore, analyticsSource:roundSource

}

function skillStats() {
  return skills.map(skill => {
    const events = history.filter(event => questionById[event.qid].skill === skill.id);
    const recent = events.slice(-3);
    const mistakes = events.filter(event => event.choice !== questionById[event.qid].a);
    const counts = new Map();
    for (const event of mistakes) {
      const label = questionById[event.qid].errors[event.choice];
      counts.set(label, (counts.get(label) || 0) + 1);
    }
    return {...skill, total:events.length, correct:events.length - mistakes.length,
      recentCorrect:recent.filter(event => event.choice === questionById[event.qid].a).length,
      recentCount:recent.length, weak:recent.some(event => event.choice !== questionById[event.qid].a),
      errors:[...counts.entries()].sort((a, b) => b[1] - a[1])};
  });
}

function choosePractice() {
  const stats = skillStats();
  const weak = stats.filter(skill => skill.weak);
  const targets = weak.length ? weak : stats;
  const candidates = practiceBank.filter(question => targets.some(skill => skill.id === question.skill));
  candidates.sort((a, b) => {
    const aEvents = history.filter(event => event.qid === a.id);
    const bEvents = history.filter(event => event.qid === b.id);
    if ((aEvents.length === 0) !== (bEvents.length === 0)) return aEvents.length ? 1 : -1;
    const aSkill = stats.find(skill => skill.id === a.skill);
    const bSkill = stats.find(skill => skill.id === b.skill);
    const aErrorRate = aSkill.recentCount ? 1 - aSkill.recentCorrect / aSkill.recentCount : 0;
    const bErrorRate = bSkill.recentCount ? 1 - bSkill.recentCorrect / bSkill.recentCount : 0;
    return bErrorRate - aErrorRate || (aEvents.at(-1)?.at || 0) - (bEvents.at(-1)?.at || 0);
  });
  const chosen = [];
  for (const question of candidates) {
    if (chosen.length < 3 && !chosen.some(item => item.skill === question.skill)) chosen.push(question);
  }
  for (const question of candidates) {
    if (chosen.length < 3 && !chosen.includes(question)) chosen.push(question);
  }
  return chosen;
}

function reportMarkup() {

}

let playbackId = 0;
let audioTimer = null;

function updateProgress() {

function stopPlayback(message = '') {
  playbackId++;
  clearTimeout(audioTimer);
  if (activeAudio) {
    activeAudio.pause();
    activeAudio.removeAttribute('src');
    activeAudio.load();
    activeAudio = null;
  }
  document.querySelectorAll('[data-audio-label]').forEach(button => {
    button.textContent = button.dataset.audioLabel;
  });
  stopButton.disabled = true;
  audioStatus.textContent = message;
}

function playRecording(kind, button, slow = false) {
  stopPlayback();
  const id = playbackId;
  const lesson = activeLessons[idx];
  const filename = `${kind}-${lesson.audioId}${slow ? '-slow' : ''}.mp3`;
  const recording = new Audio(new URL(`${lesson.audioRoot}${filename}`, document.baseURI).href);
  activeAudio = recording;
  button.textContent = '正在加载音频…';
  stopButton.disabled = false;
  audioStatus.textContent = '正在加载音频…';
  const waitForAudio = () => {
    clearTimeout(audioTimer);
    audioTimer = setTimeout(() => {
      if (id === playbackId) stopPlayback('音频加载超时，请检查网络后重试。');
    }, 15000);
  };
  recording.onplaying = () => {
    if (id !== playbackId) return;
    clearTimeout(audioTimer);
    button.textContent = '正在播放…';
    audioStatus.textContent = slow ? '正在播放慢速音频' : '正在播放';
  };
  recording.onwaiting = () => {
    if (id !== playbackId) return;
    button.textContent = '正在缓冲…';
    audioStatus.textContent = '正在缓冲音频…';
    waitForAudio();
  };
  recording.onended = () => {
    if (id === playbackId) stopPlayback('播放结束');
  };
  recording.onerror = () => {
    if (id === playbackId) stopPlayback('音频暂时无法加载，请检查网络后重试。');
  };
  waitForAudio();
  recording.play().catch(error => {
    if (id !== playbackId) return;
    stopPlayback(error.name === 'NotAllowedError' ? '浏览器阻止了播放，请再次点击播放按钮。' : '音频暂时无法播放，请稍后重试。');
  });
}

function goTo(index) {

  document.getElementById('replyAudio').onclick = event => playRecording('reply', event.currentTarget);

    ${lesson.opts.map((option, i) => `<button class="option" data-i="${i}">${String.fromCharCode(65 + i)}. ${option}</button>`).join('')}
    </div><div id="result"></div><div class="actions">
      <button class="primary" id="check" disabled>确认答案</button>
      <button class="secondary hidden" id="next">${idx === activeLessons.length - 1 ? '查看成绩' : '下一题 →'}</button>
      <button class="secondary hidden" id="retry">重做本题</button>
      ${idx > 0 ? '<button class="secondary" id="previous">← 上一题</button>' : ''}
      ${complete && idx !== activeLessons.length - 1 ? '<button class="secondary" id="summary">返回成绩</button>' : ''}
    </div>`;
  document.getElementById('listen').onclick = event => playRecording('scene', event.currentTarget);
  document.getElementById('slower').onclick = event => playRecording('scene', event.currentTarget, true);
  document.getElementById('show').onclick = event => {
    const hidden = document.getElementById('transcript').classList.toggle('hidden');
    event.currentTarget.setAttribute('aria-expanded', String(!hidden));
  };
  document.querySelectorAll('.option').forEach(button => {
    button.onclick = () => {
      if (checked) return;
      selected = Number(button.dataset.i);
      document.querySelectorAll('.option').forEach(option => option.classList.remove('selected'));
      button.classList.add('selected');
      document.getElementById('check').disabled = false;
    };
  });
  document.getElementById('check').onclick = () => {
    if (selected === null || checked) return;
    const firstSubmission = !history.some(event => event.round === roundId && event.qid === activeLessons[idx].id);
    if (firstSubmission) {
      const started = history.some(event => event.round === roundId);
      if (!started) roundSource = trainingAnalytics.source();
      history.push({round:roundId, qid:activeLessons[idx].id, choice:selected, at:Date.now()});
      if (mode === 'day1') {
        if (!started) trainingAnalytics.track('start', roundSource);
        if (activeLessons.every(question => history.some(event => event.round === roundId && event.qid === question.id))) {
          trainingAnalytics.track('complete', roundSource);
        }
      }
    }
    answers[idx] = selected;
    checked = true;
    save();
    updateProgress();
    showFeedback();
  };
  document.getElementById('next').onclick = () => goTo(idx + 1);
  document.getElementById('retry').onclick = () => {
    stopPlayback();
    selected = null;
    checked = false;
    render();
  };
  if (idx > 0) document.getElementById('previous').onclick = () => goTo(idx - 1);
  if (document.getElementById('summary')) document.getElementById('summary').onclick = () => goTo(activeLessons.length);
  if (checked) showFeedback();
}

window.addEventListener('hashchange', () => {
  incomingChallenge = readChallenge();
  renderInvitation();
});
stopButton.onclick = () => stopPlayback('已停止播放');
window.addEventListener('pagehide', () => stopPlayback());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPlayback();
});
render();
</script></body></html>
